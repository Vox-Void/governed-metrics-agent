name: Governed metrics checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: pipx install uv==0.13.9
      - name: Build and certify the synthetic snapshot
        run: ./scripts/dev bootstrap
      - name: Check the data and service
        run: ./scripts/dev test
      - name: Run the demo and scripted evaluation
        run: |
          ./scripts/dev demo
          ./scripts/dev eval
      - name: Check the isolated reader
        run: |
          docker compose build metrics-reader
          docker compose run --rm -T metrics-reader ask --root /snapshots --merchant a --json 'Net collected in ZAR on 1-2 November 2026' > artifacts/isolated-answer.json
          python3 -c 'import json; from pathlib import Path; a = json.loads(Path("artifacts/isolated-answer.json").read_bytes()); assert a["status"] == "ok" and a["rows"][0]["value"] == 13000'
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metrics-evidence
          path: |
            artifacts/demo.json
            artifacts/eval/
            artifacts/isolated-answer.json
