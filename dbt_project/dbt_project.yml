name: governed_payments
version: '1.0.0'
config-version: 2
profile: governed_payments
model-paths: ['models']
test-paths: ['tests']
seed-paths: ['../data/seeds']
models:
  governed_payments:
    staging:
      +materialized: view
    marts:
      +materialized: table
seeds:
  governed_payments:
    +quote_columns: false
    capture_deliveries:
      +column_types: {settled_at: varchar, ingested_at: varchar, amount_minor: varchar, version: varchar}
    refund_deliveries:
      +column_types: {settled_at: varchar, ingested_at: varchar, amount_minor: varchar, version: varchar}
    attempt_deliveries:
      +column_types: {initiated_at: varchar, completed_at: varchar, ingested_at: varchar, version: varchar}
