[project]
name = "governed-metrics-agent"
version = "0.1.0"
description = "Answer synthetic payment questions from certified dbt metrics"
requires-python = ">=3.11,<3.12"
dependencies = ["dbt-core==1.11.7", "dbt-duckdb==1.10.1", "duckdb==1.4.4", "pydantic==2.12.5", "pyyaml==6.0.3", "tzdata==2026.2"]

[dependency-groups]
dev = ["mypy==1.19.1", "pytest==9.0.2", "ruff==0.14.14", "types-pyyaml==6.0.12.20250915"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
